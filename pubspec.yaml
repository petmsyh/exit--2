name: ethiopian_exit_exam_prep
description: Ethiopian Exit Exam Preparation Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: 3.15.2
  cloud_firestore: 5.6.12
  firebase_auth: ^5.7.0
  firebase_storage: ^12.3.10
  
  # File handling
  file_picker: ^8.1.6
  path: ^1.8.3
  
  # Network and HTTP
  http: ^1.2.0
  url_launcher: ^6.3.1
  http_parser: ^4.0.2
  mime: ^1.0.5
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
